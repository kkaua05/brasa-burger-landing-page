<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{SEO_TITLE}}</title>
    <meta name="description" content="{{SEO_DESCRIPTION}}" />
    <meta name="theme-color" content="#65010D" />
    <meta name="color-scheme" content="dark" />
    {{CANONICAL}}

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="{{SEO_LOCALE}}" />
    <meta property="og:site_name" content="{{BRAND_NAME}}" />
    <meta property="og:title" content="{{SEO_TITLE}}" />
    <meta property="og:description" content="{{SEO_DESCRIPTION}}" />
    <meta property="og:url" content="{{OG_URL}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hambúrguer artesanal da {{BRAND_NAME}} sobre fundo bordô" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{SEO_TITLE}}" />
    <meta name="twitter:description" content="{{SEO_DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preload" href="/fonts/anton-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-sans-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="{{HERO_IMAGE_SRCSET}}"
      imagesizes="{{HERO_IMAGE_SIZES}}"
    />
    {{STRUCTURED_DATA}}
  </head>
  <body>
    <!-- Filled at build time by prerenderPlugin (vite.config.ts). -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
